name: Debian 13

on:
  push:
    branches: [master, '1.5']
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [master, '1.5']
jobs:
  Debian13:
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    steps:
      - name: checkout
        uses: actions/checkout@v3
      - name: Install required packages
        run: |
          apt update -y
          apt install -y git build-essential gcc pkg-config cmake python3 tree make which libssl-dev libssl3 libxml2-dev
      - name: Installation
        run: |
          make init
          make patch.apply
          make conf
          make build
          make install
      - name: Environment Check
        run: |
          make vars
          make exist
